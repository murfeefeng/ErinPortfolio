<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        function initFunction(jsonObj) {
            renderInfo(jsonObj);
        }
    </script>

<body class="payBody">
    <div class="bg">
        <div class="container">
            <div class="pay">
                <div class="pay_left">
                    <div id="langSelect" class="languageBox">
                        <img src="https://stage-api-page.p99pay.com/assets/img/icon_language.svg" alt="" srcset="">
                        <span class="lang_text">語言</span>
                        <ul id="langListItem" class="langListItem">
                        </ul>
                    </div>
                    <div class="info">
                        <div id="payPrice" class="textbox cardPrice">
                            <img src="https://stage-api-page.p99pay.com/assets/img/icon_money.svg" alt="">
                            <span id="payPriceTop" class="pay_price">100</span> <b id="payCUIDTop">USD</b>
                        </div>
                        <div id="PayInfo" class="textbox PayInfo"></div>
                    </div>
                </div>
                <div class="pay_right">
                    <div class="info">
                        <div class="title">
                            <h2 id="selectTIT"></h2>
                        </div>
                        <div id="TabBar" class="tab_bar">
                                <div id="PAID_TAB" class="type tabs">
                                </div>
                        </div>
                        <div class="list tab_container">
                            <!-- tab -->
                            <form role="form" id="form" action="" method="post" target="_self" class="form-payment">
                                <div id="scrollBG" class="scrollBG">

                                </div>
                                <div class="confirm">
                                    <button id="paymentOK" type="button" class="btn"
                                        onclick="location.href='check-translate.html'"></button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- loading -->
    <script src="https://stage-api-page.p99pay.com/assets/js/loadingoverlay.min.js"></script>
    <script>
        let currentJson = null;
        let currentLangDefault = null;
        let currentLang = null;
        let PAIDLIST = [];
        let LastSEL = '';
        let AMOUNTList = [];
        let newLastSEL = false;
        let langList = {};

        function renderInfo(json) {
            // 儲存資料
            currentJson = json;
            PAIDLIST = json.PAIDList;
            LastSEL = json.LastSelect;
            AMOUNTList = json.AMOUNTList;
            langList = json.LanguageList;

            //判斷當前語言
            let userLang = getCookie('userLang');
            if (userLang) {
                currentLangDefault = langSystem(userLang, json);
            } else {
                userLang = navigator.language || navigator.userLanguage;
                currentLangDefault = langSystem(userLang, json);
                setCookie(currentLangDefault);
            }
            currentLang = json.StringID[currentLangDefault];
            // console.log(currentLang);

            // 色系
            setTheme(json.Theme);

            // 渲染翻譯畫面
            renderLangList(langList, currentLangDefault);
            printPage(json, currentLang, currentLangDefault);

            // 切換語言
            changeLang(langList);
        }

        //判斷無支援的語言就用英文
        function langSystem(ss, json) {
            let langDefault = 'en_US';
            let ssLang = ss.replace('-', '_');
            let languageKeys = Object.keys(json.LanguageList);
            if (languageKeys.some(key => key.startsWith(ssLang))) {
                langDefault = languageKeys.find(key => key.startsWith(ssLang));
            }
            return langDefault;
        }

        // 設定色系
        function setTheme(theme) {
            var root = document.documentElement;
            root.style.setProperty('--primary', theme.BG_COLOR_PRIMARY);
            root.style.setProperty('--second', theme.BG_COLOR_SECOND);
            root.style.setProperty('--bg-image', 'url("' + theme.BG_IMG_URL_PC + '")');
            root.style.setProperty('--bg-image-mobile', 'url("' + theme.BG_IMG_URL_M + '")');

            if (theme.BG_IMG_URL_PC !== "" || theme.BG_IMG_URL_M !== "") {
                $('body').addClass('addBG');
            } else {
                $('body').removeClass('addBG');
            }
        }

        // 語言選單
        function renderLangList(langList, langDefault) {
            // 顯示當前語言名稱
            if (langList.hasOwnProperty(langDefault)) {
                $('.lang_text').text(langList[langDefault]);
            } else {
                $('.lang_text').text('選擇語言');
            }

            // 語言列表
            $('#langListItem').empty(); //先清空
            $.each(langList, function (key, value) {
                const listItem = $('<li></li>').attr('data-lang', key).text(value);
                $('#langListItem').append(listItem);
            });
        }

        // 切換語言
        if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            $('.languageBox').on('click', function (e) {
                e.stopPropagation();
                $(this).toggleClass('active');
            });

            $(document).on('click', function () {
                $('.languageBox').removeClass('active');
            });
        }
        function changeLang(langList) {
            $('#langListItem').off('click').on('click', 'li', function () {
                const selectLang = $(this).data('lang');
                currentLangDefault = selectLang;
                deleteCookie('userLang');
                setCookie(currentLangDefault);

                // 清空舊畫面
                $('#PAID_TAB').empty();
                $('#PayInfo').empty();
                $('.scrollBG').empty();
                $('.tab_content').empty();

                // 更新語言字串與畫面
                currentLang = currentJson.StringID[currentLangDefault];
                // console.log(currentJson);

                renderLangList(langList, currentLangDefault);
                printPage(currentJson, currentLang, currentLangDefault);
                checkTabBarScrollable();


            });
        }

        // 渲染翻譯內容
        function printPage(json, lang, langDefault) {
            newLastSEL = false; //先重置

            // 左邊資訊
            var infoLIST_tit = {
                "coid": lang.PAYMENT_INFO_COID,
                "product": lang.PAYMENT_INFO_PRODUCT,
                "currency": lang.PAYMENT_INFO_CUID,
                "amount": lang.PAYMENT_INFO_AMOUNT
            };

            // 左側資訊抬頭
            $('#PayInfo').empty();//先清空
            $.each(infoLIST_tit, function (key, value) {
                var infoHTML = `<div class="${key}">
                            <div class="list_left">
                                <h4>${value}</h4>
                            </div>
                            <div class="list_right">
                                <h3 id="${key}"></h3>
                            </div>
                        </div>`;
                $('#PayInfo').append(infoHTML);
            });

            $('#coid').text(json.COID);
            $('#product').text(json.PRODUCT);

            // tab名稱
            var tabLIST_tit_all = Object.keys(lang)
                .filter(key => key.startsWith("PA_GROUP_"))
                .reduce((acc, key) => {
                    var newKey = key.replace("PA_GROUP_", "");
                    acc[newKey] = lang[key];
                    return acc;
                }, {});

            var tabLIST_tit = {};
            var seenGroups = new Set();

            // console.log(tabLIST_tit);

            json.PAIDList.forEach(function (item) {
                var group = item.Group;
                if (!seenGroups.has(group) && tabLIST_tit_all[group]) {
                    tabLIST_tit[group] = tabLIST_tit_all[group];
                    seenGroups.add(group);
                }
            });

            // 印tab
            $('#PAID_TAB').empty();//先清空
            $.each(tabLIST_tit, function (key, value) {
                var tabHTML = `<div id="tab_${key}" class="type_box showTAB" rel="${key}">
                            <div class="imgbox">
                                <img src="https://stage-api-page.p99pay.com/assets/img/t_${key}.svg" alt="">
                            </div>
                            <p>${value}</p>
                        </div>`;
                $('#PAID_TAB').append(tabHTML);
            });

            // 印支付list
            $('.scrollBG').empty();//先清空
            $.each(tabLIST_tit, function (key) {
                var contentHTML = `<div id="${key}" class="tab_content showPAID"></div>`;
                $('.scrollBG').append(contentHTML);
            });

            // 標題文字
            $('#infoTIT').text(lang.PAYMENT_INFO);
            $('#selectTIT').text(lang.PAYMENT_SELECT);
            $('#paymentOK').html(lang.PAYMENT_CONFIRM + '<img src="https://stage-api-page.p99pay.com/assets/img/arrow.svg" alt="">');

            // 清空並渲染支付列表
            $.each(PAIDLIST, function (index, item) {
                var group = item.Group;
                var targetDiv = $("#" + group);

                if (targetDiv.length > 0) {
                    var paidLIST = `<div class="list_box">
                                <div>
                                    <input type="radio" name="SPAID" id="${item.PAID}" data-paid="${item.PAID}" data-cuid="${item.CUID}" data-group="${item.Group}" />
                                    <label for="${item.PAID}">${item.FullName}</label>
                                </div>
                                <div class="listpic">
                                    <img src="${item.ICON_URL}" alt="" />
                                </div>
                            </div>`;
                    targetDiv.append(paidLIST);
                }

                if (LastSEL === item.PAID) {
                    newLastSEL = true;
                }
            });

            // tab 點擊切換事件
            $("div.tabs div").off('click').on('click', function () {
                $(".tab_content").hide();
                var activeTab = $(this).attr("rel");
                $("#" + activeTab).fadeIn();
                $("div.tabs div").removeClass("active");
                $(this).addClass("active");
            });

            // 判斷預設選取支付
            if (newLastSEL === true) {
                var lastSEL_CUID = $("#" + LastSEL).data('cuid');
                var lastSEL_TAB = $("#" + LastSEL).data('group');
                $("#" + LastSEL).prop("checked", true).parents('.list_box').prependTo("#" + lastSEL_TAB);

                paidSELECT(lastSEL_CUID, lastSEL_TAB);
                submitSPAID(LastSEL);

                if (PAIDLIST.length < 6) {
                    $('#TabBar').hide();
                    $('.tab_content').show();
                    $('.pay_right').addClass('noTabList');
                    $('.list_box').last().css("border-bottom", "0");
                } else {
                    $('.list_box:last-child').css("border-bottom", "0");
                }
            } else {
                $('.showTAB:first').addClass("active");
                $(".tab_content").hide();
                $(".tab_content.showPAID:first").show();

                var defaultCUID = $('.list_box:first').find('input').attr("checked", true)
                    ? $('.list_box:first').find('input').data('cuid')
                    : $('.list_box:first').find('input').data('cuid'); // 避免undefined

                checkAMOUNT(defaultCUID);

                var createSPAID = $('.list_box:first').find('input[name="SPAID"]').data('paid');
                submitSPAID(createSPAID);

                if (PAIDLIST.length < 6) {
                    $('#TabBar').hide();
                    $('.tab_content').show();
                    $('.pay_right').addClass('noTabList');
                    $('.list_box').last().css("border-bottom", "0");
                } else {
                    $('.list_box:last-child').css("border-bottom", "0");
                }
            }

            // 點擊支付方式
            $('.list_box').off('click').on('click', function () {
                var sel_radio = $(this).find('input[name="SPAID"]').prop('checked', true);
                var selectedPaid = sel_radio.data('paid');
                var selectedcuid = sel_radio.data('cuid');

                checkAMOUNT(selectedcuid);
                submitSPAID(selectedPaid);
            });
        }

        // 選擇支付後對應幣別
        function paidSELECT(CUID, TAB) {
            $(".tab_content").hide();
            $('#' + TAB).show().prependTo(".tab_container form");
            $("div.tabs div").removeClass("active");
            $('#tab_' + TAB).insertBefore(".type_box:first").addClass("active");

            checkAMOUNT(CUID);
        }

        // 根據幣別顯示金額
        function checkAMOUNT(CUID) {
            var targetAmount = AMOUNTList.find(item => item.CUID === CUID);
            var targetAMOUNT = 0;
            if (targetAmount) {
                targetAMOUNT = parseFloat(targetAmount.AMOUNT);
            }
            $('#currency').text(CUID);
            $('#payCUIDTop').text(CUID);
            $("#amount").text(targetAMOUNT);
            $("#payPriceTop").text(targetAMOUNT);
        }

        // 送出
        function submitSPAID(SPAID) {
            $('.submittxt').remove();

            var newData = {
                "Type": currentJson.Type,
                "data": currentJson.data,
                "COID": currentJson.COID,
                "SPAID": SPAID
            };

            Object.keys(newData).forEach(function (k) {
                var eleName = '#' + k;
                if ($(eleName).length <= 0) {
                    appendElement_Input('#form', k, newData[k]);
                } else {
                    $(eleName).val(newData[k]);
                }
            });
        }

        // 新增隱藏input欄位
        function appendElement_Input(ele, name, value) {
            var textHtml = `<input type="text" name="${name}" value="${value}" class="submittxt" style="display:none;" />`;
            $(ele).append(textHtml);
        }

        // Cookie相關
        function setCookie(name) {
            document.cookie = "userLang=" + name + "; path=/; max-age=" + (7 * 24 * 60 * 60);
        }

        function getCookie(name) {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        }


        //表單送出
        function check_submit() {
            $.LoadingOverlay("show", {
                image: "",  // 不用預設圖片
                custom: $("<div>", { class: "custom-spinner" })[0],
                background: "rgba(255,255,255,0.8)"
            });

            // $('#form').submit();
        }
 

        //滑鼠感應
        $(document).ready(function () {
            var isMouseDown = false;
            var startX, scrollLeft;

            $('#TabBar').on('mousedown', function (e) {
                if (e.which === 1) {
                    isMouseDown = true;
                    $(this).css('cursor', 'grabbing');
                    startX = e.pageX - $(this).offset().left;
                    scrollLeft = $(this).scrollLeft();
                }
            });

            $(document).on('mousemove', function (e) {
                if (isMouseDown) {
                    e.preventDefault();
                    var x = e.pageX - $('#TabBar').offset().left;
                    var walk = (x - startX) * 2;
                    $('#TabBar').scrollLeft(scrollLeft - walk);

                }
            });

            $(document).on('mouseup', function () {
                if (isMouseDown) {
                    isMouseDown = false;
                    $('#TabBar').css('cursor', 'grab');
                }
            });
        });

        // 漸層遮罩
        function checkTabBarScrollable() {
                const tabBar = document.querySelector('.tab_bar');
                if (!tabBar) return;

                const isScrollable = tabBar.scrollWidth > tabBar.clientWidth;
                if (isScrollable) {
                    tabBar.classList.add('scrollable');
                } else {
                    tabBar.classList.remove('scrollable');
                }
                //卷軸到底
                tabBar.addEventListener('scroll', () => {
                const maxScrollLeft = tabBar.scrollWidth - tabBar.clientWidth;
                const nearRightEdge = tabBar.scrollLeft >= maxScrollLeft - 5;

                if (nearRightEdge) {
                    tabBar.classList.remove('scrollable');
                } else {
                    tabBar.classList.add('scrollable');
                }
            });
        }

        // init & resize
        window.addEventListener('load', checkTabBarScrollable);
        window.addEventListener('resize', checkTabBarScrollable);

            
    </script>
</body>
