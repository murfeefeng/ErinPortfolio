        function renderInfo(json) {

            const resultLIST = {
                "PAYMENT_INFO_PRODUCT": json.PRODUCT_NAME,
                "PAYMENT_INFO_AMOUNT": json.AMOUNT,
                "PAYMENT_INFO_CUID": json.CUID,
            }
            // console.log(dataSUCCESS);
            resultINFO(resultLIST);

            //印資料
            function resultINFO(data) {
                $(".result_info").empty();

                Object.entries(data).forEach(([key, value]) => {
                    // const TimeTXT = formatTime(value);
                    const htmlINFO = `
                        <div class="item">
                        <div class="title ${key}"></div>
                        <div class="content">${value}</div>
                        </div>`;

                    $(".result_info").append(htmlINFO);

                });
            }

            initTranslation(json)//翻譯
