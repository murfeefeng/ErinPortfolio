    <script>
        function renderInfo(json) {
            // const jsonData = JSON.parse(JSON.stringify(json));
            // $('#jsonData').val(JSON.stringify(jsonData));
            // console.log($('#jsonData').val());
            Object.keys(json).forEach(function (k) {
                var eleName = '#' + k;
                if ($(eleName).length <= 0) {
                    appendElement_Input('#form', k, json[k]);
                } else {
                    $(eleName).val(json[k]);
                }
            });
            function appendElement_Input(ele, name, value) {
                var textHtml = '<input type="text" style="display: none" name="' + name + '"';
                textHtml += ' value="' + value + '"';
                textHtml += '/>';
                $(ele).append(textHtml);
            }


            const resultLIST = {
                "商品名稱": json.PRODUCT_NAME,
                "儲值金額": json.AMOUNT,
                "幣別": json.CUID,
            }
            // console.log(dataSUCCESS);
            resultINFO(resultLIST);

            //印資料
            function resultINFO(data) {
                $(".result_info").empty();

                Object.entries(data).forEach(([key, value]) => {
                    // const TimeTXT = formatTime(value);
                    const htmlINFO = `
                        <div class="item">
                        <div class="title">${key}</div>
                        <div class="content">${value}</div>
                        </div>`;

                    $(".result_info").append(htmlINFO);

                });
            }


            // initTranslation(json)//翻譯
        }

        function check_submit() {
            //鎖住畫面
            $.LoadingOverlay("show", {
                image: "",  // 不用預設圖片
                custom: $("<div>", { class: "custom-spinner" })[0],
                background: "rgba(255,255,255,0.8)"
            });


            document.getElementById('form').submit();

            //測試用
            // setTimeout(function () {
            //     document.getElementById('form').submit();
            // }, 2000);

            // return false;
        }



    </script>
