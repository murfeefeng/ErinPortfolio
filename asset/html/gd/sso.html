    <script type="text/javascript">
        $(document).ready(function () {
            cancelCookies();
            var p1 = 'p';
            var p2 = 'sswo';
            $("#ppsd").prop("type", p1 + "a" + p2 + "rd");

            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const message = urlParams.get('message');
            const error = urlParams.get('error');

            if (message) {
                try {
                    // 解碼URL編碼的中文字符
                    const decodedMessage = decodeURIComponent(message);
                    showErrorToast(decodedMessage);
                } catch (e) {
                    console.error('解碼錯誤訊息失敗:', e);
                    showErrorToast(message);
                }
            } else if (error) {
                // 處理英文錯誤代碼
                let errorMessage = '';
                switch (error) {
                    case 'sso_login_failed':
                        errorMessage = 'SSO登入失敗，請重試';
                        break;
                    case 'sso_disabled':
                        errorMessage = 'SSO登入未啟用，請使用標準登入';
                        break;
                    case 'sso_no_ticket':
                        errorMessage = 'SSO登入失敗，未收到有效票據';
                        break;
                    default:
                        errorMessage = '登入失敗，請重試';
                }
                showErrorToast(errorMessage);
            }

            $("#ppsd").keypress(function (e) {
                var code = (e.keyCode ? e.keyCode : e.which);
                if (code == 13) {
                    loginBut();
                }
            });
        });

        function cancelCookies() {
            localStorage.clear();
        }

        function loginBut() {
            doDataLoading();
            $('#dataForm').submit();
        }


        var global = {};

        // 驗證授權是否過期
        let expiry = /**/ "";
        let warnPeriod = /**/ "";

        $(function () {
            if (expiry) {
                showWarningToast("授權已過期，您的網站功能已被限制使用");
                $(`.scpar-btn-system:not(.scpar-exclude-expiry)`).each(function () {
                    let onclickFuncName = $(this).prop('onclick');
                    if (!onclickFuncName.toString().includes("search")) {
                        $(this).prop('disabled', true);
                    }
                });
            } else if (warnPeriod) {
                // showWarningToast("您的授權即將於61天內過期，您的網站功能即將被限制使用");
            }
        });

        function doDataLoading() {
            $.blockUI({
                message: '<h1> 資料處理中</h1>',
                baseZ: 19891014,
                css: {
                    border: 'none',
                    padding: '15px',
                    backgroundColor: '#000',
                    '-webkit-border-radius': '10px',
                    '-moz-border-radius': '10px',
                    opacity: .5,
                    color: '#fff'
                }
            });
        }

        function unDataLoading() {
            $.unblockUI();
        }

        $.ajaxSetup({
            beforeSend: function (xhr) {
                let token = getClientParams('token', null);
                if (token && token != null && token != 'null') {
                    xhr.setRequestHeader("Authorization", "Bearer " + token);
                }
            }
        });

        // 驗證授權是否過期,針對查詢回來資料存在按鈕時限制操作
        $(document).ajaxComplete(function () {
            if (expiry) {
                $(`.scpar-btn-system:not(.scpar-exclude-expiry), .scpar-btn-detail:not(.scpar-exclude-expiry)`).each(function () {
                    let onclickFuncName = $(this).prop('onclick');
                    if (!onclickFuncName.toString().includes("search")) {
                        $(this).prop('disabled', true);
                    }
                });
            }
        });
    </script>
